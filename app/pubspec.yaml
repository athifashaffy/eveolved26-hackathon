name: signa
description: "Signa — understand your personal wellness patterns from wearable data."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  fl_chart: ^0.68.0
  go_router: ^14.2.7
  health: ^13.0.0
  permission_handler: ^11.3.1
  http: ^1.2.0
  crypto: ^3.0.7
  flutter_web_auth_2: ^5.0.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  csv: ^6.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  pdf: ^3.11.3
  printing: ^5.14.2
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/data/trends.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/signa_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FBF7EC"
  adaptive_icon_background: "#FBF7EC"
  adaptive_icon_foreground: "assets/icon/signa_icon.png"
