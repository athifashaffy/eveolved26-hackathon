name: signa
description: "Signa — continuous depression monitoring from wearable data."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  fl_chart: ^0.68.0
  go_router: ^14.2.7
  health: ^13.0.0
  permission_handler: ^11.3.1
  http: ^1.2.0
  crypto: ^3.0.7
  flutter_web_auth_2: ^5.0.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  csv: ^6.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/trends.json
